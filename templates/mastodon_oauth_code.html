{% set body_id = 'login' %}
{% extends "base.html" %}

{% block content %}

<p class="row big">Copy this code into your app:</p>

<p class="row big">
  <code id="code" style="word-break: break-all">{{ code }}</code>
  <button class="btn btn-default btn-copy glyphicon glyphicon-duplicate"
          data-copy="{{ code }}" title="Copy to clipboard"></button>
</p>

{% endblock %}

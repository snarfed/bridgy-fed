{% set body_id = 'login' %}
{% extends "base.html" %}

{% block content %}

<p class="row big">Log in with an existing account:</p>

<div class="row big" style="font-size: 14px">

  <form method="post" action="/oauth/bluesky/start">
    <nobr>
      <details name="login" class="row big">
        <summary class="login-button shadow login-button-logotype" title="Atmosphere (Bluesky)">
          <img src="/static/atmosphere_icon.svg" height="60" />
          <span>Atmosphere (Bluesky)</span>
        </summary>
        <label for="login-atmosphere" class="fade-in-element login-label">Handle</label>
        <input id="login-atmosphere" name="handle" type="text" class="fade-in-element login-input" placeholder="me.bsky.social" required>
        <input type="image" title="Atmosphere (Bluesky)" class="submit-button fade-in-element shadow"
              src="/static/material-arrow-icon.svg" />
      </details>
      <input name="scope" type="hidden">
    </nobr>
  </form>

  <form method="post" action="/oauth/indieauth/start">
    <nobr>
      <details name="login" class="row big">
        <summary class="login-button shadow login-button-logotype" title="IndieAuth">
          <img src="/oauth_dropins_static/indieauth_logo.png" height="60" />
          <span>IndieAuth (web)</span>
        </summary>
        <label for="login-indieauth" class="fade-in-element login-label">Web site</label>
        <input id="login-indieauth" name="me" type="url" class="fade-in-element login-input" placeholder="example.com" required>
        <input type="image" title="IndieAuth" class="submit-button fade-in-element shadow"
              src="/static/material-arrow-icon.svg" />
      </details>
    </nobr>
  </form>

  <form method="post" action="/oauth/mastodon/start">
    <nobr>
      <details name="login" class="row big">
        <summary class="login-button shadow" title="Mastodon">
          <img src="/static/mastodon_large.png" height="60" />
        </summary>
        <label for="login-mastodon" class="fade-in-element login-label">Instance</label>
        <input id="login-mastodon" name="instance" type="url" class="fade-in-element login-input" placeholder="mastodon.social" scheme="https" required>
        <input type="image" title="Mastodon" class="submit-button fade-in-element shadow"
              src="/static/material-arrow-icon.svg" />
      </details>
      <input name="scope" type="hidden">
    </nobr>
  </form>

  <form method="post" action="/oauth/pixelfed/start">
    <nobr>
      <details name="login" class="row big">
        <summary class="login-button shadow" title="Pixelfed">
          <img src="/static/pixelfed_large.png" height="60" />
        </summary>
        <label for="login-pixelfed" class="fade-in-element login-label">Instance</label>
        <input id="login-pixelfed" name="instance" type="url" class="fade-in-element login-input" placeholder="pixelfed.social" scheme="https" required>
        <input type="image" title="Pixelfed" class="submit-button fade-in-element shadow"
              src="/static/material-arrow-icon.svg" />
      </details>
      <input name="scope" type="hidden">
    </nobr>
  </form>
</div>

<p class="row">
...or if you're on another fediverse platform, or the web, <a href="/docs#get-started">get started here</a>.
</p>
{% endblock %}
